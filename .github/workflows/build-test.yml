name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes bats jq

      - name: Build
        run: |
          bash -n provision/bootstrap.sh provision/configure-copilot-settings.sh provision/install-copilot.sh scripts/rmz-copilot.sh scripts/setup-rmz-copilot.sh tests/shell-line-endings.sh
          ruby -c Vagrantfile
          jq empty provision/copilot-settings.json

      - name: Test
        run: |
          bats tests
          bash tests/shell-line-endings.sh

  test-windows-host-command:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test PowerShell host command
        shell: pwsh
        run: ./tests/rmz-copilot-windows.ps1
